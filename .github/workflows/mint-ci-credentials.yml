name: Mint CI Credentials

# Mints short-lived credentials for the vcpkg CI asset cache, binary cache, and container registry, and publishes them
# as the 'ci-credentials' artifact. Build jobs, including pull requests from forks (which cannot use OIDC), download the
# artifact from the most recent successful run of this workflow with .github/actions/get-ci-credentials.
#
# The vcpkg threat model treats these caches and images as public / untrusted: anyone who can open a pull request can
# already obtain these credentials, and official builds use the binary cache in write-only mode. Do not add credentials
# for anything else to this artifact.
#
# Setup (outside the repository):
# * A GitHub environment named 'ci-credentials' restricted to the master branch, with variables AZURE_CLIENT_ID,
#   AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID for a user-assigned managed identity.
# * A federated credential on that identity for issuer https://token.actions.githubusercontent.com, audience
#   api://AzureADTokenExchange, and this repository's 'ci-credentials' environment subject.
# * Storage Blob Delegator on the vcpkgassetcachewus and vcpkgbinarycachewus storage accounts; Storage Blob Data
#   Contributor on each account's 'cache' container; AcrPull on vcpkgandroidwus.

on:
  schedule:
    # The container registry token is only valid for 3 hours, so mint hourly.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mint-ci-credentials
  cancel-in-progress: false

jobs:
  mint:
    if: github.repository == 'microsoft/vcpkg'
    runs-on: ubuntu-latest
    environment: ci-credentials
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Mint credentials
        shell: bash
        run: |
          set -euo pipefail
          minted=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          start=$(date -u -d "-30 minutes" '+%Y-%m-%dT%H:%MZ')
          # Long enough for a job that waits in the queue for a day and then builds for two days.
          sasExpiry=$(date -u -d "4 days" '+%Y-%m-%dT%H:%MZ')
          assetSas=$(az storage container generate-sas --name cache --account-name vcpkgassetcachewus --as-user --auth-mode login --https-only --permissions rcl --start "$start" --expiry "$sasExpiry" -o tsv)
          echo "::add-mask::$assetSas"
          binarySas=$(az storage container generate-sas --name cache --account-name vcpkgbinarycachewus --as-user --auth-mode login --https-only --permissions rclw --start "$start" --expiry "$sasExpiry" -o tsv)
          echo "::add-mask::$binarySas"
          acrToken=$(az acr login --name vcpkgandroidwus --expose-token --query accessToken --output tsv 2>/dev/null)
          echo "::add-mask::$acrToken"
          acrTokenExpiry=$(date -u -d "2 hours 50 minutes" '+%Y-%m-%dT%H:%M:%SZ')
          mkdir -p "$RUNNER_TEMP/ci-credentials"
          jq -n \
            --arg minted "$minted" \
            --arg assetSas "$assetSas" \
            --arg binarySas "$binarySas" \
            --arg sasExpiry "$sasExpiry" \
            --arg acrToken "$acrToken" \
            --arg acrTokenExpiry "$acrTokenExpiry" \
            '{minted: $minted, assetSas: $assetSas, binarySas: $binarySas, sasExpiry: $sasExpiry, acrToken: $acrToken, acrTokenExpiry: $acrTokenExpiry}' \
            > "$RUNNER_TEMP/ci-credentials/credentials.json"
          echo "Minted cache SAS tokens valid through $sasExpiry and a registry token valid through $acrTokenExpiry"

      - name: Publish credentials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-credentials
          path: ${{ runner.temp }}/ci-credentials/credentials.json
          if-no-files-found: error
          retention-days: 4
