#
# Rebuilds the Linux and Android CI container images weekly so that they pick up OS security updates, and marks the
# images they replace as end-of-life.
#
# Setup (outside the repository):
# * A GitHub environment named 'container-publishing' restricted to the master branch, with variables
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID for an identity with AcrPush on vcpkgandroidwus.
#   This replaces the 'containers-updater' Azure DevOps service connection.
# * A federated credential on that identity for this repository's 'container-publishing' environment subject.

name: Update Containers

on:
  schedule:
    - cron: '0 0 * * 0' # weekly on Sundays at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-containers
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'microsoft/vcpkg'
    name: Update Containers
    runs-on:
      - self-hosted
      - 1ES.Pool=vcpkg-pr-linux
      - JobId=vcpkg-containers-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
    environment: container-publishing
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Mark previous containers end-of-life
        run: |
          EndDate=$(date -u -d "1 day" +"%Y-%m-%d")
          echo "vnd.microsoft.artifact.lifecycle.end-of-life.date=$EndDate"
          az acr login --name vcpkgandroidwus
          # Note that this is marking the *previous* image as EOL, not the one we're building as it attaches
          # to the SHA to which the tag points, not the tag itself.
          oras attach --artifact-type application/vnd.microsoft.artifact.lifecycle --annotation "vnd.microsoft.artifact.lifecycle.end-of-life.date=$EndDate" vcpkgandroidwus.azurecr.io/vcpkg-android:2026-10-19 || echo "::warning::Failed to attach lifecycle metadata to vcpkg-android:2026-10-19"
          oras attach --artifact-type application/vnd.microsoft.artifact.lifecycle --annotation "vnd.microsoft.artifact.lifecycle.end-of-life.date=$EndDate" vcpkgandroidwus.azurecr.io/vcpkg-android:2026-10-19 --platform linux/amd64 || echo "::warning::Failed to attach lifecycle metadata to vcpkg-android:2026-10-19 linux/amd64"
          oras attach --artifact-type application/vnd.microsoft.artifact.lifecycle --annotation "vnd.microsoft.artifact.lifecycle.end-of-life.date=$EndDate" vcpkgandroidwus.azurecr.io/vcpkg-linux:2026-11-02 || echo "::warning::Failed to attach lifecycle metadata to vcpkg-linux:2026-11-02"
          oras attach --artifact-type application/vnd.microsoft.artifact.lifecycle --annotation "vnd.microsoft.artifact.lifecycle.end-of-life.date=$EndDate" vcpkgandroidwus.azurecr.io/vcpkg-linux:2026-11-02 --platform linux/amd64 || echo "::warning::Failed to attach lifecycle metadata to vcpkg-linux:2026-11-02 linux/amd64"
          # Note that this is an image for *targeting* arm64, it's still an amd64 image, hence linux/amd64
          oras attach --artifact-type application/vnd.microsoft.artifact.lifecycle --annotation "vnd.microsoft.artifact.lifecycle.end-of-life.date=$EndDate" vcpkgandroidwus.azurecr.io/vcpkg-arm64-linux:2026-10-19 || echo "::warning::Failed to attach lifecycle metadata to vcpkg-arm64-linux:2026-10-19"
          oras attach --artifact-type application/vnd.microsoft.artifact.lifecycle --annotation "vnd.microsoft.artifact.lifecycle.end-of-life.date=$EndDate" vcpkgandroidwus.azurecr.io/vcpkg-arm64-linux:2026-10-19 --platform linux/amd64 || echo "::warning::Failed to attach lifecycle metadata to vcpkg-arm64-linux:2026-10-19 linux/amd64"

      - name: Build containers
        run: |
          BuildDate=$(date -u +"%Y-%m-%d")
          echo "BUILD_DATE=$BuildDate"
          # to explain the ulimit thing, see https://github.com/docker/buildx/issues/379
          docker buildx build .github/ci/android -t vcpkgandroidwus.azurecr.io/vcpkg-android:2026-10-19 --build-arg BUILD_DATE=$BuildDate --ulimit nofile=1024:1024 --load
          docker buildx build .github/ci/linux -t vcpkgandroidwus.azurecr.io/vcpkg-linux:2026-11-02 --build-arg BUILD_DATE=$BuildDate --ulimit nofile=1024:1024 --load
          docker buildx build .github/ci/linux-arm64 -t vcpkgandroidwus.azurecr.io/vcpkg-arm64-linux:2026-10-19 --build-arg BUILD_DATE=$BuildDate --ulimit nofile=1024:1024 --load

      - name: Push containers
        run: |
          docker push vcpkgandroidwus.azurecr.io/vcpkg-android:2026-10-19
          docker push vcpkgandroidwus.azurecr.io/vcpkg-linux:2026-11-02
          docker push vcpkgandroidwus.azurecr.io/vcpkg-arm64-linux:2026-10-19
