name: Get vcpkg CI credentials
description: >
  Downloads the credentials published by the most recent successful run of the mint-ci-credentials workflow and
  exports them as masked environment variables VCPKG_CI_ASSET_SAS, VCPKG_CI_BINARY_SAS, and VCPKG_CI_ACR_TOKEN.
  The calling job needs the 'actions: read' permission.

inputs:
  github-token:
    description: A token that can read Actions artifacts in this repository.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Find the latest credentials
      id: find
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const runs = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'mint-ci-credentials.yml',
            branch: 'master',
            status: 'success',
            per_page: 1,
          });
          if (runs.data.workflow_runs.length === 0) {
            core.setFailed('No successful mint-ci-credentials.yml run was found on master.');
            return;
          }
          const run = runs.data.workflow_runs[0];
          core.info(`Using credentials from ${run.html_url} (${run.updated_at})`);
          core.setOutput('run-id', String(run.id));

    - name: Download credentials
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ci-credentials
        run-id: ${{ steps.find.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ runner.temp }}/vcpkg-ci-credentials

    - name: Export credentials
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const dir = path.join(process.env.RUNNER_TEMP, 'vcpkg-ci-credentials');
          const credentials = JSON.parse(fs.readFileSync(path.join(dir, 'credentials.json'), 'utf8'));
          fs.rmSync(dir, { recursive: true, force: true });
          const exported = {
            VCPKG_CI_ASSET_SAS: credentials.assetSas,
            VCPKG_CI_BINARY_SAS: credentials.binarySas,
            VCPKG_CI_ACR_TOKEN: credentials.acrToken,
          };
          for (const [name, value] of Object.entries(exported)) {
            if (!value) {
              core.setFailed(`The published credentials are missing ${name}.`);
              return;
            }
            core.setSecret(value);
            core.exportVariable(name, value);
          }

          const sasHours = (Date.parse(credentials.sasExpiry) - Date.now()) / 3600000;
          if (sasHours < 50) {
            core.warning(`The cache SAS tokens expire in ${sasHours.toFixed(1)} hours (${credentials.sasExpiry}); long builds may lose cache access. Check the mint-ci-credentials workflow.`);
          }
          const acrMinutes = (Date.parse(credentials.acrTokenExpiry) - Date.now()) / 60000;
          if (acrMinutes < 10) {
            core.warning(`The container registry token expires in ${acrMinutes.toFixed(0)} minutes (${credentials.acrTokenExpiry}); image pulls may fail. Check the mint-ci-credentials workflow.`);
          }
